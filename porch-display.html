<div id="porch-display-emulator" aria-label="Interactive porch flight display emulator">
  <style>
    #porch-display-emulator .pd-top { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
    #porch-display-emulator .pd-layouts { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
    #porch-display-emulator .pd-controls { display:grid; grid-template-columns:1.25fr 1fr; gap:12px; margin-bottom:16px; }
    #porch-display-emulator .pd-field { display:grid; gap:5px; min-width:0; }
    #porch-display-emulator .pd-stage { --pd-case:#222328; --pd-face:#080a0b; --pd-rim:#45464a; padding:26px 22px; display:flex; justify-content:center; align-items:center; background:light-dark(#e3e4e6,#17191d); border-radius:4px; }
    #porch-display-emulator .pd-sign { width:100%; box-sizing:border-box; background:var(--pd-case); border:2px solid var(--pd-rim); padding:12px; border-radius:7px; box-shadow:0 12px 22px #0005,inset 0 1px 0 #ffffff16; }
    #porch-display-emulator .pd-sign canvas { display:block; width:100%; height:auto; background:var(--pd-face); border:1px solid #000; border-radius:1px; }
    #porch-display-emulator .pd-caption { display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px 16px; margin-top:10px; margin-bottom:16px; }
    #porch-display-emulator .pd-play { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    #porch-display-emulator .pd-settings { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
    #porch-display-emulator .pd-credit { margin:14px 0 0; }
    #porch-display-emulator [hidden] { display:none !important; }
    @media(max-width:420px) {
      #porch-display-emulator .pd-controls, #porch-display-emulator .pd-settings { grid-template-columns:1fr; }
      #porch-display-emulator .pd-stage { padding:20px 10px; }
      #porch-display-emulator .pd-sign { padding:8px; }
    }
  </style>
  <div class="pd-top">
    <strong>Porch display lab</strong>
    <span class="text-small text-muted">Sample flights · no live tracking</span>
  </div>
  <div class="pd-layouts" role="group" aria-label="Display layout">
    <button class="btn" type="button" data-layout="a" aria-pressed="true">A · City + symbol</button>
    <button class="btn" type="button" data-layout="b" aria-pressed="false">B · Postcard</button>
    <button class="btn" type="button" data-layout="c" aria-pressed="false">C · Skyline</button>
    <button class="btn" type="button" data-layout="d" aria-pressed="false">D · Reveal</button>
  </div>
  <div class="pd-controls">
    <label class="pd-field form-label">Sample origin
      <select class="form-select" id="pd-city">
        <option value="0">New York · Statue of Liberty</option>
        <option value="1">London · Big Ben</option>
        <option value="2">Paris · Eiffel Tower</option>
        <option value="3">San Francisco · Golden Gate Bridge</option>
        <option value="4">Seattle · Space Needle</option>
        <option value="5">Tokyo · Temple</option>
      </select>
    </label>
    <label class="pd-field form-label">LED resolution
      <select class="form-select" id="pd-resolution">
        <option value="32">32 rows · coarse</option>
        <option value="64" selected>64 rows · standard</option>
        <option value="128">128 rows · detailed</option>
      </select>
    </label>
  </div>
  <div class="pd-stage">
    <div class="pd-sign" id="pd-sign">
      <canvas id="pd-canvas" width="768" height="384" role="img" aria-label="Loading New York sample display">LED flight origin preview.</canvas>
    </div>
  </div>
  <div class="pd-caption text-small">
    <span id="pd-status" aria-live="polite">Loading city artwork…</span>
    <span class="text-muted tabular-nums" id="pd-spec">128 × 64 LEDs · 2:1</span>
  </div>
  <div class="pd-play">
    <button class="btn btn-primary" type="button" id="pd-play" aria-pressed="false">Play samples</button>
    <button class="btn" type="button" id="pd-next">Next flight</button>
    <button class="btn" type="button" id="pd-phase" hidden>Show landmark</button>
  </div>
  <div class="pd-settings">
    <label class="pd-field form-label">Brightness <span class="tabular-nums" id="pd-bright-value">75%</span>
      <input class="form-range" id="pd-bright" type="range" min="20" max="100" step="5" value="75" aria-label="Simulated LED brightness">
    </label>
    <label class="pd-field form-label">Hold each view <span class="tabular-nums" id="pd-hold-value">4 seconds</span>
      <input class="form-range" id="pd-hold" type="range" min="2" max="8" step="1" value="4" aria-label="Seconds per display view">
    </label>
  </div>
  <div class="text-small text-muted" id="pd-note">Pixel layout preview; screen brightness and size are not calibrated to real hardware.</div>
  <p class="pd-credit text-small text-muted">City artwork: <a href="https://svgcities.com/" target="_blank" rel="noopener noreferrer">Studio Partdirector</a> · <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>. Cropped, rasterized, and recolored for LEDs.</p>

      '3':['11110','00001','00001','01110','00001','00001','11110'],
      '4':['00010','00110','01010','10010','11111','00010','00010'],
      '5':['11111','10000','10000','11110','00001','00001','11110'],
      '6':['01110','10000','10000','11110','10001','10001','01110'],
      '7':['11111','00001','00010','00100','01000','01000','01000'],
      '8':['01110','10001','10001','01110','10001','10001','01110'],
      '9':['01110','10001','10001','01111','00001','00001','01110'],
      '>':['000','100','010','001','010','100','000'],
      '-':['000','000','000','111','000','000','000'],
      '?':['11110','00001','00001','00110','00100','00000','00100'],
      ' ':['000','000','000','000','000','000','000']
    };
    const state = { layout:'a', city:0, rows:64, brightness:75, hold:4, phase:0, playing:false, remaining:0 };
    const artwork = new Map();
    const masks = new Map();
    let cols = 128, rows = 64, pixels = new Uint8Array(cols * rows);
    let intervalId = null, animationId = null, phaseStarted = 0, pausedElapsed = 0, ready = false;
    let artErrors = [];
    const dotPitch = 6;
    const measure = (text, scale=1) => Math.max(0, [...text].reduce((n,c) => n + (font[c] || font['?'])[0].length + 1, 0) - 1) * scale;
    function rect(x, y, w, h, value=255) {
      x=Math.round(x); y=Math.round(y); w=Math.round(w); h=Math.round(h);
      for(let py=Math.max(0,y); py<Math.min(rows,y+h); py++)
        for(let px=Math.max(0,x); px<Math.min(cols,x+w); px++) pixels[py*cols+px]=value;
    }
    function text(str,x,y,scale=1,value=255) {
      x=Math.round(x); y=Math.round(y);
      for(const char of str) {
        const glyph=font[char] || font['?'];
        glyph.forEach((line,gy) => [...line].forEach((bit,gx) => { if(bit==='1') rect(x+gx*scale,y+gy*scale,scale,scale,value); }));
        x+=(glyph[0].length+1)*scale;
      }
    }
    function fitText(str,x,y,w,h,maxScale=4) {
      const choices=[[str]];
      const words=str.split(' ');
      for(let i=1;i<words.length;i++) choices.push([words.slice(0,i).join(' '),words.slice(i).join(' ')]);
      let best=null;
      for(let scale=Math.floor(maxScale);scale>=1;scale--) {
        for(const lines of choices) {
          const height=(lines.length*8-1)*scale;
          if(height<=h && lines.every(line=>measure(line,scale)<=w)) { best={lines,scale,height}; break; }
        }
        if(best) break;
      }
      if(!best) {
        // Low-resolution panels still preserve complete city names, using additional rows.
        const lines=[]; let line='';
        for(const char of str) {
          if(measure(line+char)>w && line) { lines.push(line.trim()); line=''; }
          line+=char;
        }
        if(line.trim()) lines.push(line.trim());
        if(lines.length*8-1>h) return false;
        best={lines,scale:1,height:lines.length*8-1};
      }
      const top=Math.round(y+(h-best.height)/2);
      best.lines.forEach((line,i)=>text(line,x+(w-measure(line,best.scale))/2,top+i*8*best.scale,best.scale));
      return true;
    }
    function icon(key,x,y,w,h,value=255) {
      const art=artwork.get(key);
      if(!art) { fitText('?',x,y,w,h,Math.max(1,Math.floor(h/9))); return; }
      w=Math.max(1,Math.floor(w)); h=Math.max(1,Math.floor(h));
      const cacheKey=key+':'+w+':'+h;
      if(!masks.has(cacheKey)) {
        const off=document.createElement('canvas'); off.width=w; off.height=h;
        const oc=off.getContext('2d',{willReadFrequently:true});
        const scale=Math.min(w/art.width,h/art.height);
        const dw=Math.max(1,Math.round(art.width*scale)), dh=Math.max(1,Math.round(art.height*scale));
        oc.drawImage(art,(w-dw)/2,(h-dh)/2,dw,dh);
        const rgba=oc.getImageData(0,0,w,h).data;
        const mask=new Uint8Array(w*h);
        for(let i=0;i<mask.length;i++) mask[i]=rgba[i*4+3]>=66 ? 255 : 0;
        masks.set(cacheKey,mask);
      }
      const mask=masks.get(cacheKey);
      for(let iy=0;iy<h;iy++) for(let ix=0;ix<w;ix++) if(mask[iy*w+ix]) rect(x+ix,y+iy,1,1,value);
    }
    function combined(city) {
      const r=rows/64;
      if(rows===32) {
        icon(city.icon,2,3,22,26);
        fitText(city.name,27,3,cols-29,25,1);
        return;
      }
      const divider=Math.round(cols*.39);
      icon(city.icon,5*r,5*r,divider-10*r,rows-10*r);
      rect(divider,7*r,1,rows-14*r,120);
      const x=divider+5*r,w=cols-x-5*r;
      fitText('FROM',x,5*r,w,8*r,Math.floor(r));
      fitText(city.name,x,19*r,w,30*r,Math.floor(3*r));
      fitText(city.code+' > ORD',x,53*r,w,7*r,Math.floor(r));
    }
    function postcard(city) {
      const r=rows/64;
      if(rows===32) {
        if(city.name.split(' ').some(word=>measure(word)>cols-2)) {
          fitText(city.name,1,1,cols-2,rows-2,1);
          return;
        }
        fitText(city.name,1,1,cols-2,15,1);
        icon(city.icon,8,18,16,13);
        return;
      }
      fitText('FROM',2*r,3*r,cols-4*r,7*r,Math.floor(r));
      const long=measure(city.name)>cols/r-6;
      const titleHeight=(long?15:7)*r;
      fitText(city.name,3*r,14*r,cols-6*r,titleHeight,Math.floor(r));
      const iconTop=14*r+titleHeight+4*r;
      icon(city.icon,7*r,iconTop,cols-14*r,52*r-iconTop);
      fitText(city.code+' > ORD',2*r,55*r,cols-4*r,7*r,Math.floor(r));
    }
    function skyline(city) {
      const r=rows/64;
      fitText(city.name,5*r,3*r,cols-10*r,15*r,Math.floor(2*r));
      const bottom=Math.round(53*r), top=Math.round(25*r);
      // Schematic cityscape: geometric context, not a traced or geographically accurate skyline.
      const heights=[.32,.53,.4,.75,.34,.58,.48,.7,.45,.56,.8,.4,.64,.36,.6,.46];
      const bandLeft=Math.round(cols*.12), bandRight=Math.round(cols*.88);
      const bandWidth=bandRight-bandLeft, bw=Math.max(2,Math.floor(bandWidth/19));
      for(let i=0;i<16;i++) {
        const bx=bandLeft+Math.round(i*bandWidth/16);
        const bh=Math.round((bottom-top)*heights[(i+state.city)%heights.length]);
        const center=cols/2;
        if(Math.abs(bx-center)<24*r) continue;
        rect(bx,bottom-bh,bw,bh,150);
        if(rows>=64) for(let yy=bottom-bh+3*r; yy<bottom-2*r; yy+=4*r) rect(bx+2*r,yy,1*r,1*r,0);
      }
      icon(city.icon,cols/2-24*r,21*r,48*r,32*r,255);
      rect(4*r,bottom,cols-8*r,1,190);
      if(rows>=64) fitText(city.code+' > ORD',4*r,56*r,cols-8*r,7*r,Math.floor(r));
    }
    function reveal(city) {
      const r=rows/64;
      if(state.phase===2) { combined(city); return; }
      if(state.phase===0) {
        if(rows>=64) fitText('FROM',4*r,5*r,cols-8*r,7*r,Math.floor(r));
        fitText(city.name,4*r,rows===32?4:19*r,cols-8*r,rows===32?24:27*r,Math.max(1,Math.floor(3*r)));
        if(rows>=64) fitText(city.code+' > ORD',4*r,54*r,cols-8*r,7*r,Math.floor(r));
      } else {
        icon(city.icon,cols/2-24*r,2*r,48*r,45*r);
        const caption=rows===32 && measure(city.name)>cols-4*r?city.code:city.name;
        fitText(caption,2*r,Math.round(50*r),cols-4*r,rows-Math.round(50*r),Math.max(1,Math.floor(r)));
      }
    }
    function makeBase() {
      canvas.width=cols*dotPitch; canvas.height=rows*dotPitch;
      base.width=canvas.width; base.height=canvas.height;
      baseCtx.fillStyle='#080a0b'; baseCtx.fillRect(0,0,base.width,base.height);
      baseCtx.fillStyle='#1a1a1a'; baseCtx.beginPath();
      for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) {
        baseCtx.moveTo(x*6+4.7,y*6+3);
        baseCtx.arc(x*6+3,y*6+3,1.7,0,Math.PI*2);
      }
      baseCtx.fill();
    }
    function paint(frame=pixels) {
      ctx.drawImage(base,0,0);
      const b=state.brightness/100;
      for(const level of [120,150,190,255]) {
        const power=(level/255)*(.2+.8*b);
        ctx.fillStyle='rgb('+Math.round(255*power)+','+Math.round(175*power)+','+Math.round(62*power)+')';
        ctx.beginPath();
        for(let i=0;i<frame.length;i++) if(frame[i]===level) {
          const px=(i%cols)*6+3,py=Math.floor(i/cols)*6+3;
          ctx.moveTo(px+1.9,py); ctx.arc(px,py,1.9,0,Math.PI*2);
        }
        ctx.fill();
      }
    }
    function draw(animate=false) {
      const previous=pixels.slice(), oldCols=cols, oldRows=rows;
      rows=state.rows;
      cols=rows*(state.layout==='b'?1:state.layout==='c'?3:2);
      const changed=cols!==oldCols || rows!==oldRows;
      if(changed || !base.width) makeBase();
      pixels=new Uint8Array(cols*rows);
      const city=cities[state.city];
      ({a:combined,b:postcard,c:skyline,d:reveal})[state.layout](city);
      el('pd-sign').style.maxWidth=state.layout==='b'?'370px':'100%';
      el('pd-spec').textContent=cols+' × '+rows+' LEDs · '+(cols/rows)+':1';
      el('pd-phase').hidden=state.layout!=='d';
      el('pd-phase').textContent=['Show landmark','Show both','Show city'][state.phase];
      const phase=state.layout==='d'?['City first','Landmark','City + symbol'][state.phase]:({a:'City + symbol',b:'Postcard',c:'Schematic skyline'})[state.layout];
      el('pd-status').textContent=city.name+' · '+city.code+' → ORD · '+phase;
      el('pd-note').textContent=state.layout==='c'?'Skyline buildings are schematic; the central landmark comes from the city library.':'Pixel layout preview; screen brightness and size are not calibrated to real hardware.';
      if(rows===32) el('pd-note').textContent+=' Coarse mode omits small details; long city names may use the whole sign.';
      if(artErrors.length) el('pd-note').textContent+=' Artwork unavailable: '+artErrors.join(', ')+'.';
      canvas.setAttribute('aria-label',phase+' layout. Sample flight from '+city.name+', '+city.airport+', to Chicago O’Hare. Landmark: '+city.landmark+'. '+cols+' by '+rows+' LEDs.');
      root.dataset.city=String(state.city); root.dataset.phase=String(state.phase); root.dataset.layout=state.layout;
      root.dataset.cols=String(cols); root.dataset.rows=String(rows);
      root.dataset.litPixels=String(pixels.reduce((n,v)=>n+(v>0),0));
      if(animationId) cancelAnimationFrame(animationId);
      if(animate && !changed && !reducedMotion.matches) {
        const started=performance.now(), finalFrame=pixels.slice();
        function slide(now) {
          const t=Math.min(1,(now-started)/360), eased=1-Math.pow(1-t,3), shift=Math.round(eased*cols);
          const frame=new Uint8Array(cols*rows);
          for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) frame[y*cols+x]=x+shift<cols?previous[y*cols+x+shift]:finalFrame[y*cols+x+shift-cols];
          paint(frame);
          if(t<1) animationId=requestAnimationFrame(slide); else { animationId=null; paint(); }
        }
        animationId=requestAnimationFrame(slide);
      } else paint();
    }
    function sync() {
      root.querySelectorAll('[data-layout]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.layout===state.layout)));
      el('pd-city').value=String(state.city); el('pd-resolution').value=String(state.rows);
      el('pd-play').textContent=state.playing?'Pause samples':pausedElapsed?'Resume samples':'Play samples';
      el('pd-play').setAttribute('aria-pressed',String(state.playing));
      el('pd-bright-value').textContent=state.brightness+'%';
      el('pd-hold-value').textContent=state.hold+' seconds';
      el('pd-bright').setAttribute('aria-valuetext',state.brightness+' percent');
      el('pd-hold').setAttribute('aria-valuetext',state.hold+' seconds');
      root.dataset.playing=String(state.playing);
    }
    function stop(reset=true) {
      if(intervalId) clearInterval(intervalId);
      intervalId=null;
      if(state.playing) pausedElapsed=Math.max(1,performance.now()-phaseStarted);
      state.playing=false;
      if(reset) { pausedElapsed=0; state.remaining=0; }
      sync();
    }
    function advance() {
      if(state.layout==='d' && state.phase<2) state.phase++;
      else {
        if(state.remaining<=1) { stop(); el('pd-status').textContent+=' · Samples finished'; return; }
        state.remaining--; state.city=(state.city+1)%cities.length; state.phase=0;
      }
      phaseStarted=performance.now(); pausedElapsed=0; sync(); draw(true);
    }
    function play() {
      if(!ready) return;
      if(state.playing) { stop(false); return; }
      if(!state.remaining) state.remaining=cities.length;
      state.playing=true; phaseStarted=performance.now()-pausedElapsed; pausedElapsed=0;
      intervalId=setInterval(()=>{ if(performance.now()-phaseStarted>=state.hold*1000) advance(); },80);
      sync();
    }
    root.querySelectorAll('[data-layout]').forEach(button=>button.addEventListener('click',()=>{
      stop(); state.layout=button.dataset.layout; state.phase=0; sync(); draw();
    }));
    el('pd-city').addEventListener('change',event=>{ const value=Number(event.target.value); stop(); state.city=value; state.phase=0; sync(); draw(true); });
    el('pd-resolution').addEventListener('change',event=>{ const value=Number(event.target.value); stop(); state.rows=value; sync(); draw(); });
    el('pd-play').addEventListener('click',play);
    el('pd-next').addEventListener('click',()=>{ stop(); state.city=(state.city+1)%cities.length; state.phase=0; sync(); draw(true); });
    el('pd-phase').addEventListener('click',()=>{ stop(); state.phase=(state.phase+1)%3; sync(); draw(true); });
    el('pd-bright').addEventListener('input',event=>{ state.brightness=Number(event.target.value); sync(); if(animationId) { cancelAnimationFrame(animationId); animationId=null; } paint(); });
    el('pd-hold').addEventListener('input',event=>{ state.hold=Number(event.target.value); if(state.playing) phaseStarted=performance.now(); pausedElapsed=0; sync(); });
    document.addEventListener('visibilitychange',()=>{ if(document.hidden && state.playing) stop(false); });
    // All six SVGs are embedded. No external requests or flight credentials are used.
    const embedded=JSON.parse(el('pd-icon-data').textContent);
    async function loadArtwork(city) {
      try {
        const img=new Image();
        img.src='data:image/svg+xml;base64,'+embedded[city.icon];
        await img.decode();
        const tmp=document.createElement('canvas'); tmp.width=240; tmp.height=240;
        const tc=tmp.getContext('2d',{willReadFrequently:true}); tc.drawImage(img,0,0,240,240);
        const rgba=tc.getImageData(0,0,240,240).data;
        let minX=240,minY=240,maxX=-1,maxY=-1;
        for(let y=0;y<240;y++) for(let x=0;x<240;x++) if(rgba[(y*240+x)*4+3]>65) { minX=Math.min(x,minX); minY=Math.min(y,minY); maxX=Math.max(x,maxX); maxY=Math.max(y,maxY); }
        if(maxX<minX) throw new Error('Empty icon');
        const cropped=document.createElement('canvas'); cropped.width=maxX-minX+1; cropped.height=maxY-minY+1;
        cropped.getContext('2d').drawImage(tmp,minX,minY,cropped.width,cropped.height,0,0,cropped.width,cropped.height);
        artwork.set(city.icon,cropped);
      } catch(error) { artErrors.push(city.name); }
    }
    makeBase(); sync(); draw();
    Promise.all(cities.map(loadArtwork)).then(()=>{
      ready=true; root.dataset.ready='true'; root.dataset.artworkCount=String(artwork.size); draw();
    });
  })();
  </script>
</div>
